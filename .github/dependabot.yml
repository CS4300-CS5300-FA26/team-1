version: 2
updates:
  # Python dependencies, resolved from pyproject.toml / uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Dev tooling updates arrive together; runtime dependencies get their own PRs.
      dev-tools:
        dependency-type: "development"
    labels: ["dependencies"]

  # Pinned action SHAs in .github/workflows (the version comments are updated too).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
