name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Reused by deploy.yml so the deploy pipeline runs exactly these checks.
  workflow_call:

# When reused, github.workflow is the caller's name ("Deploy"), so the deploy
# pipeline's checks never cancel, or get cancelled by, a standalone CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-only values: no GCP credentials or real secrets anywhere in this workflow.
env:
  SECRET_KEY: ci-only-not-a-real-secret
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DB_ENGINE: django.db.backends.postgresql
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_NAME: fitpro
  DB_USER: fitpro
  DB_PASSWORD: ci-only-postgres-password

jobs:
  quality:
    name: Lint, format, types, and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Rules and settings for all three tools are in pyproject.toml.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      # SAST: bandit scans the application code; CodeQL runs separately in codeql.yml.
      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r . -q

  test:
    name: Tests and Django checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # matches Cloud SQL POSTGRES_16
        env:
          POSTGRES_DB: fitpro
          POSTGRES_USER: fitpro
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitpro -d fitpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Tests and Gherkin scenarios run once, under coverage, on every trigger. Coverage
      # settings (source, omit, fail_under) are in pyproject.toml.
      - name: Run tests (Postgres)
        run: uv run coverage run manage.py test

      - name: Run Gherkin scenarios (behave)
        run: uv run coverage run --append manage.py behave

      # The coverage report, its artifact, and the 80% gate only run for PRs into main
      # (the pull_request trigger above). Pushes and the deploy pipeline skip them.
      # --fail-under=0 so writing the report never fails; the gate is its own step.
      # Printed to the job log on every trigger (the data is collected anyway).
      - name: Print coverage
        if: ${{ !cancelled() }}
        run: |
          uv run coverage report --fail-under=0
          echo "Total coverage: $(uv run coverage report --format=total --fail-under=0)%"

      - name: Coverage report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          uv run coverage xml --fail-under=0
          uv run coverage html --fail-under=0
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Enforce 80% coverage
        if: github.event_name == 'pull_request'
        run: uv run coverage report

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Deployment checks (check --deploy)
        env:
          ALLOWED_HOSTS: fitpro.example.com
          CSRF_TRUSTED_ORIGINS: https://fitpro.example.com
        run: |
          # A strong throwaway key so security.W009 is evaluated as in production.
          SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export SECRET_KEY
          # Every check tag except "mail" fails the job on warnings. "mail" is excluded
          # until a production email backend exists: MAILERS still uses the console
          # backend (mail.E001). Remove the exclusion once email is configured.
          mapfile -t tags < <(uv run python manage.py check --deploy --list-tags | grep -vx mail)
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          uv run python manage.py check --deploy --fail-level WARNING "${args[@]}"

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitpro
          POSTGRES_USER: fitpro
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitpro -d fitpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Plain HTTP in this test; production sits behind the HTTPS load balancer.
      BEHIND_HTTPS_PROXY: "False"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (no push)
        run: docker build --build-arg GIT_SHA="${{ github.sha }}" -t fitpro:ci .

      # --network host reaches the Postgres service on 127.0.0.1. --read-only and
      # --tmpfs /tmp mirror the Kubernetes readOnlyRootFilesystem + /tmp emptyDir.
      - name: Run migrations in the image
        run: |
          docker run --rm --network host --read-only --tmpfs /tmp \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e BEHIND_HTTPS_PROXY \
            -e DB_ENGINE -e DB_HOST -e DB_PORT -e DB_NAME -e DB_USER -e DB_PASSWORD \
            fitpro:ci python manage.py migrate --noinput

      - name: Start gunicorn (image CMD)
        run: |
          docker run -d --name fitpro --network host --read-only --tmpfs /tmp \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e BEHIND_HTTPS_PROXY \
            -e DB_ENGINE -e DB_HOST -e DB_PORT -e DB_NAME -e DB_USER -e DB_PASSWORD \
            fitpro:ci

      - name: Smoke test /livez/, /healthz/, /
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8000$1" || true; }
          for _ in $(seq 1 30); do
            [[ "$(status /livez/)" == 200 ]] && break
            sleep 2
          done
          livez="$(status /livez/)"; healthz="$(status /healthz/)"; root="$(status /)"
          echo "/livez/ -> $livez, /healthz/ -> $healthz, / -> $root"
          [[ "$livez" == 200 ]] || { echo "::error::/livez/ returned $livez"; exit 1; }
          [[ "$healthz" == 200 ]] || { echo "::error::/healthz/ returned $healthz"; exit 1; }
          [[ "$root" == 200 || "$root" == 3?? ]] || { echo "::error::/ returned $root"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs fitpro || true
