{% extends "accounts/base_auth.html" %}
{% block title %}Log in | FitPro{% endblock %}
{% block content %}
  <h1 class="card__title">Log in</h1>
  <p class="card__subtitle">Welcome back. Use your email or username.</p>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% include "core/_form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn--primary btn--block">Log in</button>
  </form>
  <div class="card__footer">
    <p>New to FitPro? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
{% endblock %}
