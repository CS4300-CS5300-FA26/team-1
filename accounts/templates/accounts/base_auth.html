<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitPro{% endblock %}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1f2933;
    }
    .card {
      width: 100%;
      max-width: 380px;
      margin: 1rem;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    h1 { font-size: 1.6rem; margin: 0 0 1.25rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; font: inherit; border: 1px solid #cbd2d9; border-radius: 4px; }
    .help { color: #52606d; font-size: 0.8rem; margin-top: 0.25rem; }
    .help ul { margin: 0.25rem 0 0; padding-left: 1.1rem; }
    .errorlist { color: #b00020; list-style: none; margin: 0.25rem 0 0; padding: 0; font-size: 0.9rem; }
    button { width: 100%; padding: 0.6rem; font: inherit; font-weight: 600; color: #fff; background: #1f6feb; border: 0; border-radius: 4px; cursor: pointer; }
    .alt { margin: 1.25rem 0 0; text-align: center; color: #52606d; }
  </style>
</head>
<body>
  <main class="card">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
