{% extends "core/base.html" %}
{% block title %}Get started | FitPro{% endblock %}
{% block body %}
  <div class="card">
    <h1 class="card__title">Let's set up your profile</h1>
    <p class="card__subtitle">Answer a few questions so FitPro can tailor your plan. Every question is required.</p>
    <form method="post" class="form" novalidate>
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button type="submit" class="btn btn--primary btn--block">Finish</button>
    </form>
  </div>
{% endblock %}
