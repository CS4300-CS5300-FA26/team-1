{% extends "core/base.html" %}
{% block title %}Log in - FitPro{% endblock %}
{% block content %}
<!-- This is the page for Scenario 3. {{ form }} draws the fields and any errors. -->
  <h1>Log in</h1>
  <form method="post" class="card" novalidate>
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p>New to FitPro? <a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
