<!DOCTYPE html>
<!-- The shared page layout plus a nav bar. Visitors see Log in / Sign up, and signed-in users see their email and a Log out button. -->
<!-- Logout is a small POST form because the logout route rejects plain links.-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitPro{% endblock %}</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #1f2933; }
    nav { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: #fff; border-bottom: 1px solid #e4e7eb; }
    nav a { color: #1f2933; font-weight: 600; text-decoration: none; }
    nav form { display: inline; margin: 0; }
    nav button { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; color: #3e4c59; }
    main { max-width: 26rem; margin: 3rem auto; padding: 0 1rem; }
    form.card { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #e4e7eb; }
    form.card input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin: 0.25rem 0 0.75rem; }
    form.card button { padding: 0.6rem 1.2rem; cursor: pointer; }
    .errorlist { color: #b42318; padding-left: 1.1rem; margin: 0.25rem 0; }
    .helptext { color: #52606d; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">FitPro</a>
    <span>
      {% if user.is_authenticated %}
        {{ user.email }}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a> &middot; <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
