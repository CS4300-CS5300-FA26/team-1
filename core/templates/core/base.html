{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}FitPro{% endblock %}</title>
  <script>
    // Apply a saved light/dark choice before the first paint, so the page doesn't flash.
    try {
      var savedTheme = localStorage.getItem('fitpro-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  {# Global theme: tokens, components and utilities for every page. Use its classes rather than page-level <style> blocks. #}
  <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
  <script src="{% static 'core/js/theme.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include "core/_header.html" %}
  <main id="main" class="{% block main_class %}page{% endblock %}" tabindex="-1">
    {% block body %}
      <div class="card">
        {% block content %}{% endblock %}
      </div>
    {% endblock %}
  </main>
</body>
</html>
