[project]
name = "fitpro"
version = "0.1.0"
description = "Fitness and nutrition tracking web application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "behave-django>=2.0.0",
    "coverage>=7.16.2",
]
