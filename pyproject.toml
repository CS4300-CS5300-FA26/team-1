[project]
name = "fitpro"
version = "0.1.0"
description = "Fitness and nutrition tracking web application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "behave-django>=2.0.0",
    "coverage>=7.16.2",
]

[tool.coverage.run]
source = ["core", "fitpro"]
omit = ["*/asgi.py", "*/wsgi.py", "*/migrations/*", "*/tests.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fitpro.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]