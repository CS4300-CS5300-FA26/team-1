# What the GitHub Actions deployer (fitpro-ci GSA, via scripts/deploy.sh) may do in
# the app namespace. GKE IAM (roles/container.clusterViewer) only lets it reach the
# cluster; everything inside comes from this Role.
#
# Derived from `kubectl kustomize k8s/app/overlays/prod` + the migrate Job, and the
# kubectl calls in scripts/deploy.sh:
#   kubectl apply (client-side, incl. --dry-run=server) -> get, create, patch
#   rollout status / delete --wait / get -l              -> list, watch
#   rollout undo --to-revision                           -> list replicasets, patch deployment
#   delete job (re-running the same SHA)                 -> delete on jobs only
# Deliberately absent: secrets, pods create/exec, roles/rolebindings, and delete on
# anything but Jobs. Nothing cluster-scoped beyond reading the app namespace itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fitpro-ci-deployer
  namespace: app
rules:
  # Preflight: `kubectl get namespace app`. For the namespaces resource, a Role in
  # namespace X can grant access to namespace X itself.
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["app"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Diagnostics only: pod status, describe, and logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["networking.gke.io"]
    resources: ["healthcheckpolicies", "gcpgatewaypolicies"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "create", "patch"]
---
# GKE identifies a Google service account by its email as a Kubernetes User.
# Value from: terraform output ci_service_account_email
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fitpro-ci-deployer
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fitpro-ci-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: fitpro-ci@fitpro-uccs-cs4300.iam.gserviceaccount.com
