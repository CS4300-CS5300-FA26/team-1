# GKE managed Secret Manager add-on (provider "gke", not the open-source "gcp").
# Files land in /var/secrets/<path>; settings.py reads them by these exact names.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fitpro-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/fitpro-uccs-cs4300/secrets/fitpro-django-secret-key/versions/latest"
        path: "django-secret-key"
      - resourceName: "projects/fitpro-uccs-cs4300/secrets/fitpro-db-password/versions/latest"
        path: "db-password"
      # Spotify (ADR-010). Both secrets need an enabled version, or pods and the migrate Job can't start.
      - resourceName: "projects/fitpro-uccs-cs4300/secrets/fitpro-spotify-client-secret/versions/latest"
        path: "spotify-client-secret"
      - resourceName: "projects/fitpro-uccs-cs4300/secrets/fitpro-spotify-token-encryption-key/versions/latest"
        path: "spotify-token-encryption-key"
