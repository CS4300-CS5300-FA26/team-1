# Hostnames are replaced in the overlay. The base uses a reserved .invalid name so the
# routes never match every host (an HTTPRoute without hostnames matches all of them,
# including the raw IP). Requests for unmatched hosts get the load balancer's 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fitpro-app
spec:
  parentRefs:
    - name: fitpro
      sectionName: https
  hostnames:
    - set-in-overlay.invalid
  rules:
    - backendRefs:
        - name: django-app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fitpro-redirect
spec:
  parentRefs:
    - name: fitpro
      sectionName: http
  hostnames:
    - set-in-overlay.invalid
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
